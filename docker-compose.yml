version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: residenthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: residenthub
      POSTGRES_USER: residenthub
      POSTGRES_PASSWORD: residenthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residenthub -d residenthub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
